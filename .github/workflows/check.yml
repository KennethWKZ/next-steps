# Checks that need no Claude Code: the workflows lint clean, and the plugin's JSON files parse.
# The plugin's own tests (claude plugin test .) need Claude Code, so they run on a Mac (README).
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "1.7.12"
  # sha256 of actionlint_1.7.12_linux_arm64.tar.gz, from the release's checksums file
  ACTIONLINT_SHA256: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6

jobs:
  check:
    # arm64 first: GitHub's arm64 runner, free on public repos.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -eu
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_arm64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version | head -1
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml
          echo "ok: actionlint .github/workflows/*.yml"
      - name: JSON
        run: |
          set -eu
          for f in .claude-plugin/*.json; do jq -e . "$f" >/dev/null && echo "ok: $f parses"; done
